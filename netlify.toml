# Netlify configuration — static site, no backend, no build step.
#
# Everything here is path-based rather than URL-based, so the same config
# applies unchanged to the production domain, branch deploys and PR previews
# (*.netlify.app) without per-URL edits.

[build]
  publish = "public"
  # No build command: the app is plain HTML/CSS/ES modules with zero runtime
  # dependencies. Icons are generated by `npm run icons` and committed.

# SPA-style fallback. This app is a single index.html, but the rule keeps any
# client-side route (or a stray deep link) from 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"

  [headers.values]
    # NOTE: this MUST stay on a single line. Netlify turns each line of a
    # multi-line header value into a separate header, and multiple CSP headers
    # are enforced as an intersection -- which would block the app's own API
    # calls.
    #
    # connect-src is intentionally `https:` rather than a fixed host: the user
    # chooses their own xBrowserSync instance at runtime, including self-hosted
    # ones, and that must work without redeploying this site. It still forbids
    # plaintext http:, and the app makes no third-party requests of any kind.
    # To lock this down to one instance, replace `https:` with that origin.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; manifest-src 'self'; worker-src 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

    # No analytics, telemetry or device APIs are used; deny them explicitly.
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), payment=(), usb=()"

    # Netlify serves everything over HTTPS (Let's Encrypt), which PWA install,
    # service workers and Web Crypto all require. Enforce it for repeat visits.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Asset filenames are not content-hashed (no bundler), so revalidate on every
# load. These files are small and gzip well; correctness beats a warm cache.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    # A stale service worker would pin an old app shell indefinitely.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
